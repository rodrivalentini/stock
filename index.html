<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aviso de Stock</title>
<style>
  :root{
    --bg:#1b1f1a;
    --card:#252a22;
    --card-border:#3a4230;
    --warn:#d99a3a;
    --danger:#c0503f;
    --text:#eef0e6;
    --text-dim:#9aa38c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px 14px 50px;
  }
  h1{
    text-align:center;
    font-size:1.3rem;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  .subtitle{
    text-align:center;
    color:var(--text-dim);
    font-size:.8rem;
    margin-bottom:22px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    max-width:480px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card.producto{ border-style:dashed; }
  .icon{
    font-size:1.9rem;
    line-height:1;
    margin-bottom:4px;
  }
  .name{
    font-size:1.05rem;
    font-weight:600;
    margin-top:4px;
    margin-bottom:12px;
  }
  .btn-row{
    display:flex;
    gap:6px;
    width:100%;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:8px;
    padding:10px 2px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .08s ease, filter .1s ease;
  }
  .btn:active{ transform:scale(0.94); }
  .btn.last{ background:var(--warn); color:#1b1f1a; }
  .btn.none{ background:var(--danger); color:#fff; }
  .otro-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--card-border);
    color:var(--text);
    padding:9px 6px;
    border-radius:7px;
    text-align:center;
    font-size:.85rem;
    margin-bottom:10px;
  }
  .otro-input::placeholder{ color:var(--text-dim); }
  footer{
    max-width:480px;
    margin:26px auto 0;
    text-align:center;
    font-size:.72rem;
    color:var(--text-dim);
    line-height:1.5;
  }
  .config-note{
    max-width:480px;
    margin:0 auto 18px;
    background:#3a2f22;
    border:1px solid var(--warn);
    color:var(--warn);
    font-size:.78rem;
    padding:10px 14px;
    border-radius:8px;
    display:none;
  }
  .config-note.show{ display:block; }
</style>
</head>
<body>

<h1>Aviso de Stock</h1>
<div class="subtitle">Tocá el botón según corresponda</div>

<div class="config-note" id="configNote">
  ⚠️ Falta configurar el número de WhatsApp en el script.
</div>

<div class="grid" id="grid"></div>

<footer>"Queda 1" avisa que es la última unidad. "Queda 0" avisa que no hay más.</footer>

<script>
  // ==== CONFIGURACIÓN ====
  const WHATSAPP_NUMERO = "5493513108540"; // +54 2262 351228
  const DESTINATARIO = "Marce";

  const PRODUCTOS = [
    { nombre: "Yerba" },
    { nombre: "Azúcar" },
    { nombre: "Té" },
    { nombre: "Café" },
    { nombre: "Servilletas" },
    { nombre: "Mayonesa" },
  ];

  if (!WHATSAPP_NUMERO || WHATSAPP_NUMERO.length < 10) {
    document.getElementById('configNote').classList.add('show');
  }

  function enviarWhatsapp(mensaje){
    const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
  }

  function avisarUltima(prod){
    enviarWhatsapp(`${DESTINATARIO}, queda la última unidad de ${prod}`);
  }

  function avisarSinStock(prod){
    enviarWhatsapp(`${DESTINATARIO}, no hay más ${prod}`);
  }

  function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    PRODUCTOS.forEach(({nombre}) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="name">${nombre}</div>
        <div class="btn-row">
          <button class="btn last">Queda 1</button>
          <button class="btn none">Queda 0</button>
        </div>
      `;
      card.querySelector('.btn.last').addEventListener('click', () => avisarUltima(nombre));
      card.querySelector('.btn.none').addEventListener('click', () => avisarSinStock(nombre));
      grid.appendChild(card);
    });

    // Tarjeta "Otro" - producto que no está en la lista
    const otro = document.createElement('div');
    otro.className = 'card producto';
    otro.innerHTML = `
      <div class="name">Otro</div>
      <input type="text" class="otro-input" placeholder="Nombre del producto" id="otroInput">
      <div class="btn-row">
        <button class="btn last" id="otroLast">Queda 1</button>
        <button class="btn none" id="otroNone">Queda 0</button>
      </div>
    `;
    grid.appendChild(otro);

    document.getElementById('otroLast').addEventListener('click', () => {
      const nombre = document.getElementById('otroInput').value.trim();
      if(!nombre){ alert('Escribí el nombre del producto'); return; }
      avisarUltima(nombre);
    });
    document.getElementById('otroNone').addEventListener('click', () => {
      const nombre = document.getElementById('otroInput').value.trim();
      if(!nombre){ alert('Escribí el nombre del producto'); return; }
      avisarSinStock(nombre);
    });
  }

  render();
</script>

</body>
</html>
